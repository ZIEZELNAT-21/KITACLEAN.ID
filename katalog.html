<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Kategori - Kita Clean</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .card-bounce {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }

        .card-bounce:hover {
            transform: translateY(-6px) scale(1.015);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.05);
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-[#f0f9ff] text-slate-900 min-h-screen flex flex-col" x-data="{ 
    openDropdown: false, mobileMenu: false, showEduModal: false, selectedCategory: {},
    categoriesData: {
        sepatu: { title: 'Perawatan Sepatu', bg: '#e2edf7', variants: 'Morning Brew (Kopi), Fresh Clean (Mint & Lemon)', effectiveness: 'Sangat efektif menekan bau apek hingga 12–24 jam penggunaan aktif.', steps: ['Pastikan kondisi dalam sepatu tidak basah kuyup.', 'Semprotkan langsung ke dalam sepatu (insole) sebanyak 2-3 kali.', 'Tunggu 3-5 menit hingga meresap.'], dos: 'Bagian dalam sepatu (insole), kaos kaki, dan sepatu kanvas.', donts: 'Jangan menyemprot terlalu banyak pada permukaan luar kulit asli.' },
        helm: { title: 'Higiene Helm', bg: '#e2ece4', variants: 'Cool Breeze (Sporty), Sweet Dream (Lavender)', effectiveness: 'Mampu membunuh kuman penyebab gatal di kulit kepala hingga 99%.', steps: ['Buka kaca (visor) helm selebar mungkin.', 'Semprotkan merata pada busa pipi kanan-kiri dan busa atas dalam.', 'Biarkan helm diangin-anginkan dalam posisi terbuka.'], dos: 'Seluruh lapisan kain busa bagian dalam helm dan tali pengikat.', donts: 'Jangan semprotkan langsung pada kaca helm (visor) bagian dalam.' },
        tas: { title: 'Penyegar Tas', bg: '#e6e9ee', variants: 'Bubble Pop (Bubblegum), White Tea & Sage', effectiveness: 'Menghilangkan bau sisa makanan atau ruang penyimpanan lemari lembap.', steps: ['Kosongkan tas dari benda-benda kertas atau elektronik.', 'Semprotkan tipis-tipis pada kompartemen utama.', 'Biarkan tas dalam kondisi terbuka selama beberapa menit.'], dos: 'Lapisan kain dalam (lining), tas kanvas, tas ransel cordura.', donts: 'Jangan disemprotkan langsung pada barang elektronik atau dokumen kertas.' },
        antibakteri: { title: 'Anti Bakteri Spesialis', bg: '#e8eaf2', variants: 'Kita Clean Care - Eucalyptus & Tea Tree', effectiveness: 'Efektivitas tingkat tinggi medis untuk mematikan virus, kuman, dan jamur.', steps: ['Semprotkan secara merata pada benda publik atau kain.', 'Biarkan mengering dengan sendirinya tanpa perlu dibilas.'], dos: 'Jaket ojek online, sarung tangan motor, sajadah travel.', donts: 'Jangan disemprotkan pada wajah, mata, atau luka terbuka.' }
    },
    openEdu(key) { this.selectedCategory = this.categoriesData[key]; this.showEduModal = true; this.mobileMenu = false; }
}">
    <nav class="bg-[#e0f2fe]/90 backdrop-blur-md w-full border-b border-sky-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            <a href="index.html"><img src="assets/img/logo_kitaclean_slogan.jpeg" class="h-14 mix-blend-multiply"></a>
            <div class="hidden md:flex items-center space-x-8 font-extrabold text-sm">
                <a href="index.html" class="text-slate-700">Home</a>
                <a href="daftar_produk.html" class="text-slate-700">Semua Produk</a>
                <button @click="openEdu('sepatu')" class="text-[#4ca766] cursor-pointer">Panduan Edukasi</button>
                <a href="about.html" class="text-slate-700">Tentang Kami</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-10 flex flex-col justify-center">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div @click="openEdu('sepatu')"
                class="card-bounce bg-[#e2edf7] rounded-[32px] p-8 flex flex-col justify-between min-h-[300px] cursor-pointer group">
                <div class="w-full flex justify-center"><svg class="w-24 h-24 text-slate-800" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
                            d="M21 16V8a2 2 0 00-1.35-1.9l-6-2a2 2 0 00-1.3 0l-6 2A2 2 0 005 8v8a2 2 0 001.35 1.9l6 2a2 2 0 001.3 0l6-2A2 2 0 0021 16z">
                        </path>
                    </svg></div>
                <div class="flex justify-between items-end">
                    <h2 class="text-2xl font-black text-slate-900 uppercase">Perawatan<br>Sepatu</h2>
                    <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center">→</div>
                </div>
            </div>
            <div @click="openEdu('helm')"
                class="card-bounce bg-[#e2ece4] rounded-[32px] p-8 flex flex-col justify-between min-h-[300px] cursor-pointer group">
                <div class="w-full flex justify-center"><svg class="w-24 h-24 text-slate-800" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
                            d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                    </svg></div>
                <div class="flex justify-between items-end">
                    <h2 class="text-2xl font-black text-slate-900 uppercase">Higiene<br>Helm</h2>
                    <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center">→</div>
                </div>
            </div>
            <div @click="openEdu('tas')"
                class="card-bounce bg-[#e6e9ee] rounded-[32px] p-8 flex flex-col justify-between min-h-[300px] cursor-pointer group">
                <div class="w-full flex justify-center"><svg class="w-24 h-24 text-slate-800" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
                            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg></div>
                <div class="flex justify-between items-end">
                    <h2 class="text-2xl font-black text-slate-900 uppercase">Penyegar<br>Tas</h2>
                    <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center">→</div>
                </div>
            </div>
            <div @click="openEdu('antibakteri')"
                class="card-bounce bg-[#e8eaf2] rounded-[32px] p-8 flex flex-col justify-between min-h-[300px] cursor-pointer group">
                <div class="w-full flex justify-center"><svg class="w-24 h-24 text-slate-800" fill="none"
                        stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2"
                            d="M12 4v1m0 14v1m8-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-11.314l.707.707m11.314 11.314l.707-.707M12 15a3 3 0 110-6 3 3 0 010 6z">
                        </path>
                    </svg></div>
                <div class="flex justify-between items-end">
                    <h2 class="text-2xl font-black text-slate-900 uppercase">Anti Bakteri<br>Spesialis</h2>
                    <div class="w-10 h-10 bg-black text-white rounded-full flex items-center justify-center">→</div>
                </div>
            </div>
        </div>
    </main>

    <div class="fixed inset-0 z-50 overflow-y-auto" x-show="showEduModal" x-cloak>
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs" @click="showEduModal = false"></div>
        <div class="flex min-h-full items-center justify-center p-4">
            <div class="relative rounded-[28px] bg-white text-left shadow-2xl w-full max-w-2xl overflow-hidden border flex flex-col"
                x-show="showEduModal" x-transition>
                <div class="p-6 flex justify-between items-center" :style="'background-color: ' + selectedCategory.bg">
                    <div><span class="text-[10px] font-black text-[#4ca766] uppercase tracking-wider">Panduan
                            Penggunaan</span>
                        <h3 class="text-xl font-black mt-0.5" x-text="selectedCategory.title"></h3>
                    </div>
                    <button @click="showEduModal = false"
                        class="text-slate-500 text-2xl cursor-pointer">&times;</button>
                </div>
                <div class="p-6 space-y-4 max-h-[60vh] overflow-y-auto text-sm font-medium text-slate-600">
                    <div>
                        <h4 class="font-black text-slate-900 uppercase text-xs">Varian:</h4>
                        <p x-text="selectedCategory.variants" class="text-base text-[#4ca766] font-black mt-0.5"></p>
                    </div>
                    <div>
                        <h4 class="font-black text-slate-900 uppercase text-xs">Efektivitas:</h4>
                        <p x-text="selectedCategory.effectiveness" class="mt-0.5"></p>
                    </div>
                    <div>
                        <h4 class="font-black text-slate-900 uppercase text-xs">Langkah Aplikasi:</h4>
                        <ol class="list-decimal pl-4 space-y-1 mt-1"><template x-for="step in selectedCategory.steps">
                                <li x-text="step"></li>
                            </template></ol>
                    </div>
                </div>
                <div class="p-4 bg-slate-50 border-t flex justify-between gap-4">
                    <button @click="window.location.href='daftar_produk.html'"
                        class="px-5 py-2.5 bg-[#4ca766] text-white text-xs font-black uppercase tracking-wider rounded-xl cursor-pointer">Lihat
                        Produk</button>
                    <button @click="showEduModal = false"
                        class="px-5 py-2.5 bg-slate-900 text-white text-xs font-black uppercase tracking-wider rounded-xl cursor-pointer">Tutup</button>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400 font-medium">
        <p>© 2026 kitclean.id. Hak Cipta Dilindungi</p>
    </footer>
</body>

</html>

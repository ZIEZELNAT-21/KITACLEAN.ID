<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja - Kitaclean.id</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="bg-sky-50 text-gray-800 font-sans" x-data="{
          <!-- Data produk simulasi yang terintegrasi dengan harga -->
          items: [
              { id: 1, name: 'Morning Brew', price: 35000, qty: 1, img: 'assets/img/produk_morning_brew.jpeg' },
              { id: 2, name: 'Sweet Dream', price: 35000, qty: 0, img: 'assets/img/produk_sweet_dream.jpeg' },
              { id: 3, name: 'Bubble Pop', price: 35000, qty: 2, img: 'assets/img/produk_bubble_pop.jpeg' }
          ],
          <!-- Fungsi menghitung total item di keranjang -->
          get totalItems() {
              return this.items.reduce((sum, item) => sum + item.qty, 0);
          },
          <!-- Fungsi menghitung total harga belanja -->
          get totalPrice() {
              return this.items.reduce((sum, item) => sum + (item.price * item.qty), 0);
          },
          <!-- Fungsi format rupiah otomatis -->
          formatRupiah(number) {
              return 'Rp ' + number.toLocaleString('id-ID');
          }
      }">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <div class="flex items-center space-x-3">
                <img src="assets/img/logo_kitaclean_slogan.jpeg" alt="Logo Kitaclean" class="h-10 w-auto rounded">
                <span class="font-bold text-xl text-emerald-600 tracking-wide">KitaClean</span>
            </div>
            <div class="hidden md:flex space-x-6 font-medium">
                <a href="index.html" class="text-gray-600 hover:text-emerald-600 transition">Beranda</a>
                <a href="katalog.html" class="text-gray-600 hover:text-emerald-600 transition">Katalog</a>
                <a href="daftar_produk.html" class="text-gray-600 hover:text-emerald-600 transition">Produk</a>
                <a href="about.html" class="text-gray-600 hover:text-emerald-600 transition">Tentang Kami</a>
            </div>
            <!-- Icon Keranjang dengan Badge Real-time -->
            <div class="relative p-2 text-emerald-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                </svg>
                <span
                    class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white bg-red-500 rounded-full"
                    x-text="totalItems">0</span>
            </div>
        </div>
    </nav>

    <!-- UTAMA -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Keranjang Belanja Anda</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- LIST PRODUK DI KERANJANG -->
            <div class="lg:col-span-2 space-y-4">

                <!-- Menggunakan Loop Alpine.js untuk menampilkan produk yang qty > 0 -->
                <template x-for="item in items" :key="item.id">
                    <div x-show="item.qty > 0"
                        class="bg-white p-4 rounded-2xl shadow-sm flex items-center justify-between border border-sky-100">
                        <div class="flex items-center space-x-4">
                            <img :src="item.img" :alt="item.name" class="w-20 h-20 object-cover rounded-xl">
                            <div>
                                <h3 class="font-bold text-gray-900 text-lg" x-text="item.name"></h3>
                                <p class="text-emerald-600 font-semibold mt-1" x-text="formatRupiah(item.price)"></p>
                            </div>
                        </div>

                        <!-- Pengatur Jumlah Kuantitas -->
                        <div class="flex items-center space-x-3 bg-sky-50 p-1 rounded-xl">
                            <button @click="if(item.qty > 0) item.qty--"
                                class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm font-bold text-gray-600 hover:bg-red-50 hover:text-red-500 transition">-</button>
                            <span class="w-6 text-center font-bold text-gray-800" x-text="item.qty"></span>
                            <button @click="item.qty++"
                                class="w-8 h-8 flex items-center justify-center bg-white rounded-lg shadow-sm font-bold text-gray-600 hover:bg-emerald-50 hover:text-emerald-500 transition">+</button>
                        </div>
                    </div>
                </template>

                <!-- Tampilan jika keranjang kosong -->
                <div x-show="totalItems === 0"
                    class="bg-white p-12 rounded-2xl shadow-sm text-center border border-dashed border-sky-200">
                    <p class="text-gray-500 text-lg">Keranjang belanja Tuan Muda masih kosong nih.</p>
                    <a href="daftar_produk.html"
                        class="mt-4 inline-block bg-emerald-600 text-white px-6 py-2 rounded-xl font-semibold hover:bg-emerald-700 transition">Lihat
                        Produk</a>
                </div>

            </div>

            <!-- RINGKASAN BELANJA -->
            <div class="bg-white p-6 rounded-2xl shadow-md border border-sky-100 h-fit">
                <h2 class="text-xl font-bold text-gray-900 mb-4">Ringkasan Orde</h2>
                <div class="space-y-3 text-sm border-b border-gray-100 pb-4">
                    <div class="flex justify-between text-gray-600">
                        <span>Total Item</span>
                        <span class="font-semibold text-gray-900" x-text="totalItems + ' Botol'"></span>
                    </div>
                    <div class="flex justify-between text-gray-600">
                        <span>Biaya Pengiriman</span>
                        <span class="text-emerald-600 font-semibold">Gratis Ongkir</span>
                    </div>
                </div>
                <div class="flex justify-between items-center pt-4 mb-6">
                    <span class="font-bold text-gray-900">Total Harga</span>
                    <span class="text-xl font-extrabold text-emerald-600" x-text="formatRupiah(totalPrice)"></span>
                </div>

                <!-- Tombol Lanjut ke Checkout -->
                <button :disabled="totalItems === 0" @click="window.location.href='pembayaran.html'"
                    :class="totalItems === 0 ? 'bg-gray-300 cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700'"
                    class="w-full text-white py-3 rounded-xl font-bold transition shadow-sm text-center block">
                    Lanjut ke Pembayaran
                </button>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-gray-900 text-gray-400 py-8 mt-24 border-t border-gray-800">
        <div class="max-w-7xl mx-auto px-4 text-center text-sm">
            <p>&copy; 2026 Kitaclean.id. Semua Hak Dilindungi.</p>
        </div>
    </footer>

</body>

</html>

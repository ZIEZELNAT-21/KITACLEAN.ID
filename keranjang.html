<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Belanja Premium - Kita Clean</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-[#f0f9ff] text-slate-900 min-h-screen flex flex-col" x-data="{
    cart: JSON.parse(localStorage.getItem('kitaclean_cart') || '[]'),
    removeItem(keyId) {
        this.cart = this.cart.filter(item => item.keyId !== keyId);
        localStorage.setItem('kitaclean_cart', JSON.stringify(this.cart));
    },
    getTotal() { return this.cart.reduce((sum, item) => sum + item.price, 0) }
}">
    <nav class="bg-white border-b border-slate-100 h-20 px-4 flex justify-between items-center sticky top-0 z-50">
        <a href="index.html"><img src="assets/img/logo_kitaclean_slogan.jpeg" class="h-14 mix-blend-multiply"></a>
        <a href="daftar_produk.html" class="text-sm font-black text-[#4ca766] uppercase tracking-wide">← Lanjut
            Belanja</a>
    </nav>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-12">
        <h1 class="text-3xl font-black uppercase text-slate-900 mb-8 tracking-tight">Daftar Belanja Anda</h1>

        <div class="grid md:grid-cols-12 gap-8 items-start">
            <div class="md:col-span-7 space-y-4">
                <template x-for="item in cart" :key="item.keyId">
                    <div
                        class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs flex items-center justify-between gap-4">
                        <div class="flex items-center gap-4">
                            <img :src="item.img" class="w-16 h-16 object-cover rounded-xl bg-slate-50 border">
                            <div>
                                <h4 class="font-black uppercase text-sm text-slate-900" x-text="item.name"></h4>
                                <p class="text-[#4ca766] text-xs font-bold mt-0.5"
                                    x-text="'Rp' + item.price.toLocaleString('id-ID')"></p>
                            </div>
                        </div>
                        <button @click="removeItem(item.keyId)"
                            class="p-2 text-red-500 hover:bg-red-50 rounded-xl transition cursor-pointer">
                            &times; Hapus
                        </button>
                    </div>
                </template>
                <div x-show="cart.length === 0"
                    class="bg-white rounded-3xl p-12 text-center text-slate-400 font-bold uppercase border">Keranjang
                    Belanja Masih Kosong</div>
            </div>

            <div class="md:col-span-5 bg-white p-6 rounded-3xl border border-slate-100 shadow-xs space-y-6"
                x-show="cart.length > 0">
                <h3 class="text-lg font-black uppercase tracking-wide text-slate-900">Total Tagihan</h3>
                <div
                    class="flex justify-between items-center border-t border-b border-slate-100 py-4 font-black text-xl text-slate-900">
                    <span>Subtotal</span>
                    <span class="text-[#4ca766]" x-text="'Rp' + getTotal().toLocaleString('id-ID')"></span>
                </div>
                <a href="pembayaran.html"
                    class="w-full block py-4 bg-[#4ca766] hover:bg-[#3f9154] text-white text-center font-black uppercase tracking-widest text-xs rounded-xl shadow-xs transition">Lanjut
                    Pengisian Pembayaran</a>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400 font-medium">
        <p>© 2026 kitclean.id. Hak Cipta Dilindungi</p>
    </footer>
</body>

</html>

<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hubungi Manajemen Layanan - Kita Clean</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f0f9ff] text-slate-900 min-h-screen flex flex-col">
    <nav class="bg-white border-b h-20 px-6 flex justify-between items-center sticky top-0 z-50">
        <a href="index.html"><img src="assets/img/logo_kitaclean_slogan.jpeg" class="h-14 mix-blend-multiply"></a>
        <div class="flex items-center space-x-6 text-sm font-extrabold">
            <a href="index.html" class="text-slate-700">Home</a>
            <a href="lokasi.html" class="text-slate-700">Lokasi Toko</a>
            <a href="kontak.html" class="text-[#4ca766]">Kontak</a>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-16 flex items-center">
        <div
            class="bg-white rounded-[32px] p-6 sm:p-10 border shadow-xs grid md:grid-cols-12 gap-10 w-full items-start">

            <div class="md:col-span-5 space-y-6">
                <div>
                    <span class="text-xs font-black text-[#4ca766] uppercase tracking-widest">Customer Care</span>
                    <h1 class="text-3xl font-black uppercase text-slate-950 tracking-tight mt-1">Hubungi Kami</h1>
                    <p class="text-slate-500 font-medium text-xs mt-2 leading-relaxed">Punya keluhan, pertanyaan seputar
                        kemitraan reseller, atau saran pengembangan produk? Hubungi tim support kami.</p>
                </div>
                <div class="space-y-4 border-t border-slate-100 pt-6 text-xs sm:text-sm font-bold text-slate-700">
                    <div class="flex items-center gap-3"><span>📧</span><span>support@kitclean.id</span></div>
                    <div class="flex items-center gap-3"><span>📞</span><span>+62 812-3456-7890</span></div>
                    <div class="flex items-center gap-3"><span>📍</span><span>Kota Sukabumi, Jawa Barat,
                            Indonesia</span></div>
                </div>
            </div>

            <form @submit.prevent="alert('Pesan terkirim! Terima kasih telah menghubungi kami.'); this.reset()"
                class="md:col-span-7 space-y-4 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                <div>
                    <label class="block text-xs font-black uppercase text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" required
                        class="w-full p-3 bg-white border border-slate-200 rounded-xl outline-none focus:border-[#4ca766] font-semibold text-xs">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase text-slate-700 mb-1">Email Aktif</label>
                    <input type="email" required
                        class="w-full p-3 bg-white border border-slate-200 rounded-xl outline-none focus:border-[#4ca766] font-semibold text-xs">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase text-slate-700 mb-1">Isi Pesan / Keluhan</label>
                    <textarea rows="4" required
                        class="w-full p-3 bg-white border border-slate-200 rounded-xl outline-none focus:border-[#4ca766] font-semibold text-xs resize-none"></textarea>
                </div>
                <button type="submit"
                    class="w-full py-3.5 bg-[#4ca766] hover:bg-[#3f9154] text-white font-black uppercase text-xs tracking-widest rounded-xl transition cursor-pointer">Kirim
                    Pesan Sekarang</button>
            </form>

        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-4 text-center text-xs text-slate-400 font-medium">
        <p>© 2026 kitclean.id. Hak Cipta Dilindungi</p>
    </footer>
</body>

</html>

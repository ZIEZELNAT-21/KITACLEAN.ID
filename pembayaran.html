<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - Kita Clean</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f0f9ff] text-slate-900 min-h-screen flex flex-col" x-data="{
    cart: JSON.parse(localStorage.getItem('kitaclean_cart') || '[]'),
    payMethod: '',
    checkoutAction() {
        if(!this.payMethod) { alert('Harap pilih saluran opsi pembayaran!'); return; }
        alert('Pesanan Sukses Diterima! Silakan selesaikan tagihan via ' + this.payMethod);
        localStorage.removeItem('kitaclean_cart');
        window.location.href = 'index.html';
    }
}">
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-12 flex items-center">
        <div class="grid md:grid-cols-12 gap-8 w-full items-stretch">
            <div
                class="md:col-span-7 bg-white p-6 sm:p-8 rounded-[32px] border border-slate-100 shadow-sm flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-black uppercase text-slate-900 mb-6 tracking-wide">Ringkasan Invoice</h2>
                    <div class="space-y-3 max-h-64 overflow-y-auto pr-2">
                        <template x-for="item in cart" :key="item.keyId">
                            <div class="flex justify-between items-center border-b border-slate-50 pb-2.5">
                                <span class="font-bold text-sm text-slate-700 uppercase" x-text="item.name"></span>
                                <span class="text-sm font-black text-[#4ca766]"
                                    x-text="'Rp' + item.price.toLocaleString('id-ID')"></span>
                            </div>
                        </template>
                    </div>
                </div>
                <div
                    class="flex justify-between items-center pt-6 border-t border-slate-100 font-black text-base text-slate-900 mt-6">
                    <span>TOTAL YANG WAJIB DIBAYAR</span>
                    <span class="text-xl text-[#4ca766]"
                        x-text="'Rp' + cart.reduce((sum, item) => sum + item.price, 0).toLocaleString('id-ID')"></span>
                </div>
            </div>

            <div
                class="md:col-span-5 bg-white p-6 rounded-[32px] border border-slate-100 shadow-sm flex flex-col justify-between space-y-6">
                <div>
                    <h3 class="text-lg font-black uppercase text-slate-900 mb-4 tracking-wide">Saluran Pembayaran</h3>
                    <div class="space-y-3">
                        <label
                            class="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl cursor-pointer hover:border-[#4ca766] transition">
                            <input type="radio" name="pay" value="Virtual Account BCA" x-model="payMethod"
                                class="w-4 h-4 accent-[#4ca766]">
                            <span class="font-bold text-sm text-slate-800">Bank Virtual Account BCA</span>
                        </label>
                        <label
                            class="flex items-center gap-3 p-3.5 bg-slate-50 border rounded-xl cursor-pointer hover:border-[#4ca766] transition">
                            <input type="radio" name="pay" value="QRIS Digital Wallet" x-model="payMethod"
                                class="w-4 h-4 accent-[#4ca766]">
                            <span class="font-bold text-sm text-slate-800">QRIS Mandiri / Dana / OVO</span>
                        </label>
                    </div>
                </div>
                <button @click="checkoutAction()"
                    class="w-full py-4 bg-slate-950 hover:bg-slate-800 text-white font-black uppercase tracking-widest text-xs rounded-xl shadow-md transition cursor-pointer">Konfirmasi
                    & Bayar</button>
            </div>
        </div>
    </main>
</body>

</html>

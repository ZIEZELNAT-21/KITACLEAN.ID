<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Pembayaran - Kita Clean</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-[#e0f2fe] text-slate-900 min-h-screen flex flex-col" x-data="{
          cart: JSON.parse(localStorage.getItem('kitaclean_cart') || '[]'),
          nama: '',
          telepon: '',
          alamat: '',
          metodeBayar: 'Transfer Bank',

          get totalPrice() {
              return this.cart.reduce((sum, item) => sum + item.price, 0);
          },

          get detailOrderTeks() {
              let counts = {};
              this.cart.forEach(item => {
                  counts[item.name] = (counts[item.name] || 0) + 1;
              });
              return Object.entries(counts).map(([name, qty]) => `${qty}x ${name}`).join(', ');
          },

          kirimPesanan() {
              if(!this.nama || !this.telepon || !this.alamat) {
                  alert('Mohon lengkapi informasi pengiriman terlebih dahulu, Tuan Muda!');
                  return;
              }

              let noAdmin = '+62 812-1165-1921'; 
              
              let teks = `*PESANAN BARU - KITACLEAN.ID*\n\n` +
                         `*Detail Pelanggan:*\n` +
                         `• Nama: ${this.nama}\n` +
                         `• No. HP: ${this.telepon}\n` +
                         `• Alamat: ${this.alamat}\n\n` +
                         `*Daftar Belanjaan:*\n` +
                         `• ${this.detailOrderTeks}\n\n` +
                         `*Metode Pembayaran:*\n` +
                         `• ${this.metodeBayar}\n\n` +
                         `*Total Tagihan:* Rp ${this.totalPrice.toLocaleString('id-ID')}\n\n` +
                         `Mohon segera diproses dan berikan instruksi pembayaran ya Admin, terima kasih!`;

              let urlWA = 'https://api.whatsapp.com/send?phone=' + noAdmin + '&text=' + encodeURIComponent(teks);
              
              window.open(urlWA, '_blank');
          }
      }">

    <nav class="bg-[#e0f2fe]/90 backdrop-blur-md w-full border-b border-sky-100 sticky top-0 z-50 shadow-xs">
        <div class="max-w-full px-6 sm:px-10 lg:px-14">
            <div class="flex justify-between h-28 items-center">
                <a href="index.html" class="flex items-center h-28">
                    <img src="assets/img/logo_kitaclean_slogan.jpeg" alt="Kita Clean Logo"
                        class="h-28 w-auto object-contain py-2 mix-blend-multiply">
                </a>
                <div>
                    <a href="index.html"
                        class="px-5 py-2.5 border-2 border-slate-300 hover:border-[#4ca766] text-slate-700 hover:text-[#4ca766] text-sm font-bold rounded-xl bg-white shadow-xs transition duration-200 flex items-center gap-2">
                        <span>← Kembali Belanja</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 sm:px-10 lg:px-14 py-12">
        <h1 class="text-3xl font-black uppercase text-slate-900 tracking-wide mb-10">Formulir Pengiriman</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

            <div class="lg:col-span-2 bg-white p-8 rounded-[32px] shadow-sm border border-sky-100 space-y-6">
                <div>
                    <label class="block text-sm font-extrabold uppercase text-slate-500 tracking-wider mb-2">Nama
                        Penerima</label>
                    <input type="text" x-model="nama" placeholder="Masukkan nama lengkap"
                        class="w-full px-4 py-4 rounded-xl border border-slate-200 focus:outline-none focus:border-[#4ca766] transition font-medium">
                </div>

                <div>
                    <label class="block text-sm font-extrabold uppercase text-slate-500 tracking-wider mb-2">Nomor
                        WhatsApp Aktif</label>
                    <input type="tel" x-model="telepon" placeholder="Contoh: 081234xxxxxx"
                        class="w-full px-4 py-4 rounded-xl border border-slate-200 focus:outline-none focus:border-[#4ca766] transition font-medium">
                </div>

                <div>
                    <label class="block text-sm font-extrabold uppercase text-slate-500 tracking-wider mb-2">Alamat
                        Lengkap Rumah</label>
                    <textarea x-model="alamat" rows="3"
                        placeholder="Nama jalan, nomor rumah, RT/RW, kecamatan, kota/kabupaten"
                        class="w-full px-4 py-4 rounded-xl border border-slate-200 focus:outline-none focus:border-[#4ca766] transition font-medium"></textarea>
                </div>

                <div class="space-y-3">
                    <label class="block text-sm font-extrabold uppercase text-slate-500 tracking-wider">Metode
                        Pembayaran</label>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <label class="flex items-center p-4 border rounded-xl cursor-pointer transition"
                            :class="metodeBayar === 'Transfer Bank' ? 'border-[#4ca766] bg-emerald-50/40' : 'border-slate-200'">
                            <input type="radio" name="payment" value="Transfer Bank" x-model="metodeBayar"
                                class="accent-[#4ca766]">
                            <span class="ml-3 font-bold text-slate-800 text-sm">Transfer Bank (BCA/Mandiri)</span>
                        </label>
                        <label class="flex items-center p-4 border rounded-xl cursor-pointer transition"
                            :class="metodeBayar === 'E-Wallet' ? 'border-[#4ca766] bg-emerald-50/40' : 'border-slate-200'">
                            <input type="radio" name="payment" value="E-Wallet" x-model="metodeBayar"
                                class="accent-[#4ca766]">
                            <span class="ml-3 font-bold text-slate-800 text-sm">E-Wallet (DANA/OVO/Gopay)</span>
                        </label>
                    </div>
                </div>
            </div>

            <div
                class="bg-white p-8 rounded-[32px] shadow-sm border border-sky-100 h-fit flex flex-col justify-between">
                <div>
                    <h2 class="text-xl font-black uppercase text-slate-900 mb-6">Ringkasan Orde</h2>

                    <div class="max-h-60 overflow-y-auto space-y-3 mb-6 pr-1">
                        <template x-for="item in cart" :key="item.id">
                            <div
                                class="flex items-center gap-3 p-2 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                                <img :src="item.img" class="w-10 h-10 object-cover rounded-lg">
                                <div class="flex-grow">
                                    <p class="font-extrabold uppercase text-slate-800" x-text="item.name"></p>
                                    <p class="text-[#4ca766] font-bold"
                                        x-text="'Rp' + item.price.toLocaleString('id-ID')"></p>
                                </div>
                            </div>
                        </template>
                        <div x-show="cart.length === 0"
                            class="text-center py-6 text-slate-400 font-bold uppercase text-sm">Keranjang kosong</div>
                    </div>

                    <div class="flex justify-between items-center border-t border-slate-100 pt-4 mb-6">
                        <span class="text-xs font-extrabold uppercase text-slate-400">Total Pembayaran</span>
                        <span class="text-2xl font-black text-[#4ca766]"
                            x-text="'Rp' + totalPrice.toLocaleString('id-ID')"></span>
                    </div>
                </div>

                <button @click="kirimPesanan()" :disabled="cart.length === 0"
                    :class="cart.length === 0 ? 'bg-slate-300 cursor-not-allowed' : 'bg-[#4ca766] hover:bg-[#3f9154]'"
                    class="w-full text-white py-4 rounded-xl font-extrabold transition shadow-md text-center block uppercase tracking-wider text-sm cursor-pointer">
                    Konfirmasi via WhatsApp
                </button>
            </div>

        </div>
    </main>

    <footer class="bg-white text-[#757575] py-7 text-center border-t border-slate-100 text-sm mt-auto">
        <div>© 2026 kitclean.id. Hak Cipta Dilindungi</div>
    </footer>

</body>

</html>

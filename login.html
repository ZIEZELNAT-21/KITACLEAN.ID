<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk & Daftar Akun - Kita Clean</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-[#f0f9ff] text-slate-900 min-h-screen flex items-center justify-center p-4 sm:p-6"
    x-data="{ isLogin: true }">
    <div
        class="bg-white w-full max-w-5xl rounded-[32px] shadow-xl border border-sky-100 overflow-hidden grid md:grid-cols-2">
        <div class="hidden md:flex flex-col justify-between p-12 bg-linear-to-br from-[#e0f2fe] to-[#bae6fd] relative">
            <div
                class="absolute inset-0 opacity-10 bg-[radial-gradient(#4ca766_1px,transparent_1px)] [background-size:16px_16px]">
            </div>
            <a href="index.html" class="relative z-10 block">
                <img src="assets/img/logo_kitaclean_slogan.jpeg" alt="Kita Clean" class="h-14 mix-blend-multiply">
            </a>
            <div class="relative z-10 my-auto space-y-4">
                <h1 class="text-4xl font-black uppercase text-slate-900 tracking-tight leading-tight">
                    Anti Bau.<br>Anti Bakteri.<br><span class="text-[#4ca766]">Fresh Seharian.</span>
                </h1>
                <p class="text-slate-600 font-semibold text-sm max-w-sm">Dapatkan akses penuh ke koleksi pembersih dan
                    pewangi premium untuk menunjang kepercayaan diri aktivitas harianmu.</p>
            </div>
            <div class="relative z-10 text-xs text-slate-500 font-bold uppercase tracking-wider">© 2026 kitclean.id
            </div>
        </div>

        <div class="p-8 sm:p-12 flex flex-col justify-center">
            <div class="mb-8 md:hidden text-center">
                <img src="assets/img/logo_kitaclean_slogan.jpeg" alt="Kita Clean"
                    class="h-12 mix-blend-multiply mx-auto mb-4">
            </div>

            <div class="mb-6">
                <h2 class="text-3xl font-black text-slate-950 uppercase tracking-tight"
                    x-text="isLogin ? 'Selamat Datang' : 'Buat Akun Baru'"></h2>
                <p class="text-slate-500 text-sm font-medium mt-1"
                    x-text="isLogin ? 'Silakan masuk menggunakan akun terdaftar Anda.' : 'Lengkapi data di bawah ini untuk mendaftar.'">
                </p>
            </div>

            <form
                @submit.prevent="alert(isLogin ? 'Berhasil Masuk!' : 'Pendaftaran Berhasil!'); window.location.href='index.html'"
                class="space-y-4">
                <div x-show="!isLogin" x-cloak x-transition>
                    <label class="block text-xs font-black uppercase text-slate-700 tracking-wider mb-1.5">Nama
                        Lengkap</label>
                    <input type="text" :required="!isLogin"
                        class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-[#4ca766] focus:bg-white font-semibold transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-black uppercase text-slate-700 tracking-wider mb-1.5">Alamat
                        Email</label>
                    <input type="email" required
                        class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-[#4ca766] focus:bg-white font-semibold transition text-sm">
                </div>
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-black uppercase text-slate-700 tracking-wider">Password</label>
                        <a href="#" x-show="isLogin" class="text-xs font-bold text-[#4ca766] hover:underline">Lupa
                            Password?</a>
                    </div>
                    <input type="password" required
                        class="w-full px-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-[#4ca766] focus:bg-white font-semibold transition text-sm">
                </div>
                <div class="pt-2">
                    <button type="submit"
                        class="w-full py-4 bg-[#4ca766] hover:bg-[#3f9154] text-white font-black uppercase rounded-xl tracking-widest shadow-md cursor-pointer transition active:scale-98 text-sm"
                        x-text="isLogin ? 'Masuk Sekarang' : 'Daftar Akun'"></button>
                </div>
            </form>

            <div class="mt-8 text-center text-sm font-semibold text-slate-500 border-t border-slate-100 pt-6">
                <span x-text="isLogin ? 'Belum bergabung dengan kami?' : 'Sudah memiliki akun?'"></span>
                <button @click="isLogin = !isLogin"
                    class="text-[#4ca766] font-black ml-1 cursor-pointer hover:underline focus:outline-none"
                    x-text="isLogin ? 'Daftar Di Sini' : 'Masuk Di Sini'"></button>
            </div>
        </div>
    </div>
</body>

</html>

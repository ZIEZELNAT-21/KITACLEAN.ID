<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detail Spec Produk - Kita Clean</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>

<body class="bg-[#f0f9ff] text-slate-900 min-h-screen flex flex-col" x-data="{
    cart: JSON.parse(localStorage.getItem('kitaclean_cart') || '[]'),
    prod: { name: 'Morning Brew', price: 15000, img: 'assets/img/produk_morning_brew.jpeg', desc: 'Parfum khusus insole sepatu dengan wangi kopi arabika panggang yang hangat, terbukti ampuh menetralisir molekul bau asam akibat kelembapan berlebih kaki secara instan.' },
    qty: 1,
    buyNow() {
        for(let i=0; i<this.qty; i++){ this.cart.push({ keyId: Date.now() + i, name: this.prod.name, price: this.prod.price, img: this.prod.img }) }
        localStorage.setItem('kitaclean_cart', JSON.stringify(this.cart));
        window.location.href = 'keranjang.html';
    }
}">
    <nav class="bg-[#e0f2fe]/90 backdrop-blur-md w-full border-b border-sky-100 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 flex justify-between h-20 items-center">
            <a href="index.html"><img src="assets/img/logo_kitaclean_slogan.jpeg" class="h-14 mix-blend-multiply"></a>
            <div class="flex items-center space-x-6 font-extrabold text-sm">
                <a href="index.html" class="text-slate-700">Home</a>
                <a href="daftar_produk.html" class="text-[#4ca766]">Produk</a>
                <a href="keranjang.html" class="relative text-slate-700">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
                    </svg>
                    <span
                        class="absolute top-0 right-0 w-3.5 h-3.5 bg-red-500 text-white text-[9px] rounded-full flex items-center justify-center"
                        x-text="cart.length" x-show="cart.length > 0"></span>
                </a>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl w-full mx-auto px-4 py-12 flex items-center">
        <div class="bg-white rounded-[32px] p-6 sm:p-10 border shadow-xs grid md:grid-cols-2 gap-10 w-full">
            <div
                class="bg-amber-50 rounded-2xl p-4 flex items-center justify-center aspect-square overflow-hidden border border-amber-100">
                <img :src="prod.img" class="w-full h-full object-cover rounded-xl shadow-xs">
            </div>
            <div class="flex flex-col justify-between space-y-6">
                <div>
                    <span class="text-xs font-black text-[#4ca766] uppercase tracking-widest">Koleksi Best Seller</span>
                    <h1 class="text-3xl font-black uppercase text-slate-900 mt-1 tracking-tight" x-text="prod.name">
                    </h1>
                    <div class="text-2xl font-black text-slate-900 mt-3"
                        x-text="'Rp' + prod.price.toLocaleString('id-ID')"></div>
                    <p class="text-slate-500 font-medium text-sm mt-4 leading-relaxed border-t border-slate-100 pt-4"
                        x-text="prod.desc"></p>
                </div>

                <div class="space-y-4">
                    <div class="flex items-center gap-4">
                        <span class="text-xs font-black uppercase text-slate-600">Jumlah:</span>
                        <div class="flex items-center border border-slate-200 rounded-xl bg-slate-50 overflow-hidden">
                            <button @click="if(qty > 1) qty--"
                                class="px-3 py-1.5 font-bold hover:bg-slate-200 cursor-pointer">-</button>
                            <span class="px-4 font-black text-sm" x-text="qty"></span>
                            <button @click="qty++"
                                class="px-3 py-1.5 font-bold hover:bg-slate-200 cursor-pointer">+</button>
                        </div>
                    </div>
                    <button @click="buyNow()"
                        class="w-full py-4 bg-[#4ca766] hover:bg-[#3f9154] text-white font-black uppercase tracking-widest rounded-xl text-xs transition cursor-pointer shadow-sm">Masukkan
                        & Amankan Pesanan</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-100 py-4 text-center text-xs text-slate-400 font-medium">
        <p>© 2026 kitclean.id. Hak Cipta Dilindungi</p>
    </footer>
</body>

</html>
